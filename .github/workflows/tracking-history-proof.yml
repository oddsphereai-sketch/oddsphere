name: Tracking history proof
on:
  pull_request:
    paths:
      - 'lib/services/trackingAggregateService.ts'
      - 'lib/services/tracking/**'
      - 'lib/services/labResponseSnapshots.ts'
      - 'lib/services/labResponseSnapshotWriter.ts'
      - 'app/lab/tracking/**'
      - 'app/api/lab/tracking-foundation/**'
      - 'scripts/test-ucl-alternate-line-lifetime.ts'
      - 'scripts/test-homepage-tracking-parity.ts'
      - 'scripts/test-homepage-category-tracker.ts'
      - 'scripts/test-tracking-ucl-lifetime.ts'
      - 'scripts/test-tracking-locked-grade.ts'
      - 'lib/db/schema-migration-v65-tracking-page-first.sql'
      - 'lib/db/schema-migration-v67-nfl-props-tracking-value-capacity.sql'
      - 'scripts/test-nfl-props-tracking-capacity-postgres.mjs'
      - 'scripts/test-tracking-page-first*'
      - '.github/workflows/tracking-history-proof.yml'
  merge_group:
permissions:
  contents: read
jobs:
  tracking-history-proof:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1
      SUPABASE_SERVICE_ROLE_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/test-tracking-page-first.ts && node --import tsx scripts/test-tracking-snapshot-projection.ts && node --import tsx scripts/test-tracking-integrity-audit.ts
      - run: npm install --prefix "$RUNNER_TEMP/tracking-page-proof" --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.5.15
      - run: node scripts/test-tracking-page-first-postgres.mjs "$RUNNER_TEMP/tracking-page-proof/node_modules/@electric-sql/pglite/dist/index.js"
      - run: node scripts/test-nfl-props-tracking-capacity-postgres.mjs "$RUNNER_TEMP/tracking-page-proof/node_modules/@electric-sql/pglite/dist/index.js"
      - run: node --import tsx scripts/test-homepage-tracking-parity.ts && node --import tsx scripts/test-homepage-category-tracker.ts && node --import tsx scripts/test-tracking-ucl-lifetime.ts && node --import tsx scripts/test-tracking-locked-grade.ts && node --import tsx scripts/test-ucl-alternate-line-lifetime.ts && node --import tsx scripts/test-alternate-line-performance.ts && node --import tsx scripts/test-tracking-aggregates.ts && node --import tsx scripts/test-tracking-page.ts && node --import tsx scripts/test-official-tracking-markets.ts
