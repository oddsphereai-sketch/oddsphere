name: Market Brain PostgreSQL proof

on:
  pull_request:
    paths:
      - "lib/db/schema-migration-v45-nfl-market-brain-shadow.sql"
      - "lib/db/schema-migration-v46-nfl-market-brain-proof-boundary.sql"
      - "lib/db/schema-migration-v47-market-brain-evidence-attempts.sql"
      - "lib/db/schema-migration-v48-market-brain-capture-plans.sql"
      - "lib/db/schema-migration-v49-market-brain-attempt-claims.sql"
      - "lib/services/football/**"
      - "lib/services/marketBrain/**"
      - "lib/playerPropsAi/**"
      - "lib/db/schema-migration-v6*-player-props-ai-*.sql"
      - "lib/db/schema-migration-v7*-player-props-ai-*.sql"
      - "scripts/test-player-props-ai-**"
      - "scripts/fixtures/nfl-market-brain-v45-installed.sql"
      - "scripts/fixtures/nfl-market-brain-v46-lifecycle-proof.sql"
      - "scripts/build-nfl-market-brain-v46-lifecycle-prelude.ts"
      - "scripts/build-market-brain-v48-lifecycle-proof.ts"
      - "scripts/test-nfl-market-brain-postgres-v46.sh"
      - "scripts/test-nfl-market-brain-**"
      - "scripts/test-market-brain-**"
      - "package.json"
      - ".github/workflows/market-brain-postgres-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oddsphere_market_brain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oddsphere_market_brain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MARKET_BRAIN_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/oddsphere_market_brain_test
      MARKET_BRAIN_POSTGRES_PROOF_DISPOSABLE: YES
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare nonsecret test environment
        run: cp .env.example .env.local
      - name: Prove exact NFL tracking quote evidence and immutable legacy records
        run: node --import tsx scripts/test-nfl-player-props-snapshot-store.ts && node --import tsx scripts/test-nfl-player-props-tracking-identity.ts
      - name: Prove truthful NFL input status and retained review authority
        run: node --import tsx scripts/test-player-props-ai-nfl-identity.ts && node --import tsx scripts/test-player-props-ai-scoped-publication.ts
      - name: Prove all offered NFL quarterback markets settle without changing locked predictions
        run: node --import tsx scripts/test-nfl-player-props-settlement.ts && node --import tsx scripts/test-player-props-ai-nfl-event-settlement.ts && node --import tsx scripts/test-nfl-props-reviewed-dnp-recovery.ts
      - name: Prove source-grounded forecast semantics and retained legacy law authority
        run: node --import tsx scripts/test-player-props-ai-source-constraint-cards.ts && node --import tsx scripts/test-player-props-ai-market-navigation.ts && node --import tsx scripts/test-player-props-ai-nba-component-source.ts && node --import tsx scripts/test-player-props-ai-actor-admission.ts && node --import tsx scripts/test-player-props-ai-actor-admission-audit.ts && node --import tsx scripts/test-player-props-ai-context-coverage.ts && node --import tsx scripts/test-player-props-ai-nba-source-identity.ts && node --import tsx scripts/test-player-props-ai-execution-evidence.ts && node --import tsx scripts/test-player-props-ai-game-admission.ts && node --import tsx scripts/test-player-props-ai-game-admission-runtime.ts && node --import tsx scripts/test-player-props-ai-nba-review-rescue.ts && node --import tsx scripts/test-player-props-ai-nba-review-rescue-route.ts && node --import tsx scripts/test-nfl-player-props-source-failure-integration.ts && node --import tsx scripts/test-player-props-ai-nfl-identity-failure-evidence.ts && node --import tsx scripts/test-player-props-ai-lock-authority.ts && node --import tsx scripts/test-player-props-ai-lock-authority-runtime.ts && node --import tsx scripts/test-player-props-ai-generative-coordinates.ts && node --import tsx scripts/test-player-props-ai-generative-admission.ts && node --import tsx scripts/test-player-props-ai-source-events.ts && node --import tsx scripts/test-player-props-ai-complete-sentences.ts && node --import tsx scripts/test-player-props-ai-openai.ts && node --import tsx scripts/test-player-props-ai-rejection-evidence.ts && node --import tsx scripts/test-player-props-ai-current-execution.ts && node --import tsx scripts/test-player-props-ai-forecast-semantics.ts && node --import tsx scripts/test-player-props-ai-reader.ts && node --import tsx scripts/test-player-props-ai-core.ts && node --import tsx scripts/test-player-props-ai-site.ts && node --import tsx scripts/test-player-props-ai-output-headroom.ts
      - name: Prove bounded source preparation and healthy-game deadline isolation
        run: node --import tsx scripts/test-player-props-ai-preparation-deadline.ts && node --import tsx scripts/test-player-props-ai-failure-codes.ts
      - name: Prove audited participation, original clocks, book independence and NBA publication authority
        run: node --import tsx scripts/test-player-props-ai-participation-eligibility.ts && node --import tsx scripts/test-player-props-ai-participation-publication.ts && node --import tsx scripts/test-player-props-ai-live-source-availability.ts && node --import tsx scripts/test-player-props-ai-underlying-book-anchor.ts && node --import tsx scripts/test-player-props-ai-nba-lock-authority.ts && node --import tsx scripts/test-player-props-ai-nba-lock-authority-runtime.ts && node --import tsx scripts/test-player-props-ai-nba-writer-handoff.ts && node --import tsx scripts/test-player-props-ai-nba-out-coverage.ts && node --import tsx scripts/test-player-props-ai-nfl-participation-sources.ts && node --import tsx scripts/test-player-props-ai-calendar-reconciliation.ts && node --import tsx scripts/test-player-props-ai-calendar-runtime.ts
      - name: Prove exact MLB events and timely canonical publication without changing legacy locks
        run: node --import tsx scripts/test-player-props-ai-mlb-event-settlement.ts && node --import tsx scripts/test-player-props-ai-mlb-handoff.ts && node --import tsx scripts/test-player-props-ai-mlb-handoff-runtime.ts && node --import tsx scripts/test-player-props-ai-mlb-writer-handoff.ts
      - name: Prove native NBA writer, lifecycle and member contracts retain legacy locks
        run: node --import tsx scripts/test-nba-player-props-lifecycle.ts && node --import tsx scripts/test-nba-player-props-private-tracking.ts && node --import tsx scripts/test-nba-player-props-reader-contract.ts && node --import tsx scripts/test-nba-player-props-foundation.ts && node --import tsx scripts/test-nba-player-props-member-prices.ts && node --import tsx scripts/test-nba-player-props-production-readiness.ts
      - name: Install isolated PostgreSQL client for props wallet proof
        run: npm install --prefix "$RUNNER_TEMP/props-pg-deps" --ignore-scripts --package-lock=false pg@8.16.3
      - name: Prove exact props wallet installation, Standard funding, correction escrow and mocked reviewer
        run: |
          node scripts/test-player-props-ai-standard-escrow.mjs "$RUNNER_TEMP/props-pg-deps/node_modules/pg/lib/index.js" --ci-disposable 5432 "$GITHUB_WORKSPACE"
          node --import tsx scripts/test-player-props-ai-wallet.ts "$RUNNER_TEMP/props-pg-deps/node_modules/pg/lib/index.js" --ci-disposable
          node --import tsx scripts/test-player-props-ai-nfl-identity-failure-postgres.ts "$RUNNER_TEMP/props-pg-deps/node_modules/pg/lib/index.js" --ci-disposable
          node --import tsx scripts/test-player-props-ai-calendar-lifecycle-postgres.ts "$RUNNER_TEMP/props-pg-deps/node_modules/pg/lib/index.js" --ci-disposable
      - name: Run mandatory model-change gate and real PostgreSQL proof
        run: npm run verify:model-change
